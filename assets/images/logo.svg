<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 72" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A67C1E" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3E5A5" />
      <stop offset="100%" stop-color="#9C721A" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F671E" />
    </linearGradient>
  </defs>

  <!-- ============================================== -->
  <!-- SLEEK MINIMAL ICON: Pure Architectural Canopy & 'B' -->
  <!-- ============================================== -->
  <g transform="translate(4, 6)">
    <!-- Minimalist Circular Halo / Ring (Ultra-fine 1.5px luxury line) -->
    <circle cx="30" cy="30" r="28" fill="#FFFFFF" stroke="url(#gold)" stroke-width="1.8" />
    <circle cx="30" cy="30" r="25" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.35" />

    <!-- Pure Minimalist Marquee Drape Arc -->
    <path d="M 14,24 Q 30,34 46,24" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" />

    <!-- Minimal Modern 'B' in Classic Luxury Proportions -->
    <path d="M 24,19 L 24,42 M 24,19 L 33,19 C 37,19 39,21 39,24 C 39,27 37,29 33,29 L 24,29 M 24,29 L 34,29 C 38.5,29 41,31.5 41,35.5 C 41,39.5 38.5,42 34,42 L 24,42" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Small Accent Dot -->
    <circle cx="30" cy="14" r="1.5" fill="url(#gold)" />
  </g>

  <!-- ============================================== -->
  <!-- MODERN MINIMALIST HIGH-END TYPOGRAPHY -->
  <!-- ============================================== -->
  <g transform="translate(80, 14)">
    <!-- Main Title -->
    <text x="0" y="27" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="26" font-weight="800" letter-spacing="4" fill="#0F172A">
      BILAL
    </text>
    <text x="115" y="27" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="26" font-weight="700" letter-spacing="3.5" fill="url(#gold)">
      DECOR
    </text>
    <text x="246" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="#64748B">
      STUDIO
    </text>

    <!-- Clean Modern Tagline -->
    <text x="2" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.8" fill="#8E6B1E">
      MARQUEE CEILINGS &amp; STAGE DRAPERY
    </text>
  </g>
</svg>